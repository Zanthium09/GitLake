name: "gitlake"
version: "1.0.0"
config-version: 2

profile: "gitlake"

model-paths: ["models"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

models:
  gitlake:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      # Overridden per-model to incremental (see each mart's config block).
      # The default stays view so a model that forgets to set its own
      # materialization fails loudly in dbt build rather than silently
      # behaving like a table no one chose.
      +schema: marts
