# Kafka in KRaft mode -- no Zookeeper. Since Kafka 3.3 the broker can run its
# own consensus, so a single container replaces the two-container broker +
# Zookeeper setup that most tutorials still show.
#
#   docker compose up -d      start
#   docker compose down       stop, keep the data
#   docker compose down -v    stop and wipe the topic
#
# Kafka UI is at http://localhost:8082 (8080 is reserved for Airflow in week 4,
# 8081 for dbt docs in week 3).

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: gitlake-kafka
    ports:
      # Only the external listener is published. 9093 is controller traffic
      # and 29092 is container-to-container, neither belongs on the host.
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      # One process acting as both broker and controller. Fine for a single
      # node; in production these are separate roles on separate machines.
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Three listeners because clients reach the broker by three different
      # addresses. A client connects once, then Kafka replies with the
      # advertised address it should actually use -- so getting these wrong
      # produces a connection that succeeds and then hangs.
      #   INTERNAL  other containers, via the compose network name
      #   EXTERNAL  the WSL host, where producer.py and Spark run
      #   CONTROLLER  KRaft consensus, broker to itself here
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Replication factor 1 everywhere -- there is only one broker, and the
      # defaults of 3 would leave these internal topics permanently
      # under-replicated and the broker unable to start.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Default is 3000ms, which adds a pointless three-second pause to every
      # consumer group start on a single-node cluster.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # KRaft requires a cluster id at format time. Pinned rather than
      # generated so the volume survives a container recreate.
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

      # Must be set explicitly. This image defaults to /tmp/kafka-logs, so a
      # volume mounted anywhere else is silently ignored -- the broker works,
      # the topic looks fine, and everything is lost when the container is
      # removed because /tmp lives in the container's own filesystem.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # kafka-ui starts before the broker is ready otherwise, and shows an
      # empty cluster that never populates.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: gitlake-kafka-ui
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: gitlake
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
